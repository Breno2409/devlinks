<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLinks</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="container">
      <!-- Perfil -->
      <div id="profile">
        <img
          src="https://images.unsplash.com/photo-1580489944761-15a19d654956?&w=200&q=80&auto=format&fit=crop"
          alt="Foto de perfil de Maria Silva"
        />
        <p>@maria.silva.dev</p>
      </div>

      <!-- Botão de troca de tema -->
      <button
        id="switch"
        type="button"
        aria-label="Ativar tema claro"
        aria-pressed="false"
      >
        <span aria-hidden="true"></span>
      </button>

      <!-- Links principais -->
      <ul>
        <li>
          <a href="https://www.rocketseat.com.br/eventos" target="_blank" rel="noopener noreferrer">Inscrever-se no NLW</a>
        </li>
        <li>
          <a href="#" target="_blank" rel="noopener noreferrer">Baixar meu e-book</a>
        </li>
        <li>
          <a href="#" target="_blank" rel="noopener noreferrer">Ver meu portfólio</a>
        </li>
        <li>
          <a href="https://rocketseat.com.br" target="_blank" rel="noopener noreferrer">Conhecer a Rocketseat</a>
        </li>
      </ul>

      <!-- Ícones de Redes Sociais -->
      <div id="social-links">
        <a href="https://github.com/seu-github" target="_blank" rel="noopener noreferrer">
          <ion-icon name="logo-github"></ion-icon>
        </a>
        <a href="https://instagram.com/seu-instagram" target="_blank" rel="noopener noreferrer">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a href="https://youtube.com/seu-youtube" target="_blank" rel="noopener noreferrer">
          <ion-icon name="logo-youtube"></ion-icon>
        </a>
        <a href="https://linkedin.com/in/seu-linkedin" target="_blank" rel="noopener noreferrer">
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
      </div>

      <footer>
        Feito com ♥ pela <a href="https://rocketseat.com.br" target="_blank" rel="noopener noreferrer">Rocketseat</a>
      </footer>
    </div>

    <!-- Scripts de Ícones e Lógica do Tema -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
